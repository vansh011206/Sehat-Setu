services:
  # PostgreSQL 16 Database
  db:
    image: postgres:16-alpine
    container_name: sehatsetu_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sehatsetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sehatsetu"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: sehatsetu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django Backend (Daphne ASGI + Channels + DRF)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sehatsetu_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py makemigrations accounts doctors appointments consultations prescriptions notifications &&
             python manage.py migrate &&
             python manage.py seed_specialties &&
             python manage.py seed_users &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-sehatsetu-local-secret-key-1234567890
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,backend
      - DATABASE_URL=postgres://postgres:postgres@db:5432/sehatsetu
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - MEDIA_URL=/media/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend (Vite + React 19 + TypeScript + Tailwind)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sehatsetu_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
