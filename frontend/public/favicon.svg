<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sehat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#sehat-grad)" />

  <!-- Subtle inner rim light for depth -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#ring-grad)" stroke-width="1.5" />

  <!-- Medical Cross Watermark -->
  <g opacity="0.16" fill="#ffffff">
    <rect x="26" y="14" width="12" height="36" rx="6" />
    <rect x="14" y="26" width="36" height="12" rx="6" />
  </g>

  <!-- Medical Lifeline Pulse Wave -->
  <path
    d="M 8 32 H 18 L 24 16 L 34 48 L 42 12 L 48 38 L 52 32 H 56"
    fill="none"
    stroke="#ffffff"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>