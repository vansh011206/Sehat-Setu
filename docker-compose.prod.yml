services:
  postgres:
    image: postgres:16-alpine
    container_name: sehatsetu_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sehatsetu_db}
      POSTGRES_USER: ${POSTGRES_USER:-sehatsetu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sehatsetu_pass_secure_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sehatsetu_user} -d ${POSTGRES_DB:-sehatsetu_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sehatsetu_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sehatsetu_backend
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py demo_seed &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-prod-key-sehatsetu-super-secret-2026}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      DATABASE_URL: postgres://${POSTGRES_USER:-sehatsetu_user}:${POSTGRES_PASSWORD:-sehatsetu_pass_secure_2026}@postgres:5432/${POSTGRES_DB:-sehatsetu_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sehatsetu_celery_worker
    restart: always
    command: celery -A config worker --loglevel=info
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-prod-key-sehatsetu-super-secret-2026}
      DATABASE_URL: postgres://${POSTGRES_USER:-sehatsetu_user}:${POSTGRES_PASSWORD:-sehatsetu_pass_secure_2026}@postgres:5432/${POSTGRES_DB:-sehatsetu_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sehatsetu_celery_beat
    restart: always
    command: celery -A config beat --loglevel=info
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-prod-key-sehatsetu-super-secret-2026}
      DATABASE_URL: postgres://${POSTGRES_USER:-sehatsetu_user}:${POSTGRES_PASSWORD:-sehatsetu_pass_secure_2026}@postgres:5432/${POSTGRES_DB:-sehatsetu_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sehatsetu_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
